      rel="stylesheet"
    />
    <script>
      // Evita flash de tema incorrecto antes de que cargue React.
      // Sin tema guardado, el sitio arranca en oscuro.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
